name: CI

# The gate chain from docs/WEBSITE_SPEC.md §11:
# typecheck → lint → stylelint → test → build → e2e.
# Cheap checks run first so a type error fails in under a minute rather than
# after a Playwright install.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  static:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint styles
        run: npm run lint:styles

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

  e2e:
    name: Build and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only what Playwright needs; the full `--with-deps` install pulls in
      # browsers this suite never launches.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          # The build must not depend on secrets. Contact delivery is checked
          # at request time, not at build time — see src/lib/env.ts.
          NEXT_PUBLIC_SITE_URL: https://example.com

      - name: End-to-end and accessibility
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
